# Host nginx for the Docker stack: admin.plexivia.com -> admin container (published on port 8010 by default).
# The admin container proxies /api (REST + WebSocket) to the backend container itself.
# api.plexivia.com keeps using deploy/api.plexivia.com.conf (backend is published on 127.0.0.1:5095).
server {
    listen 80;
    listen [::]:80;
    server_name admin.plexivia.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
