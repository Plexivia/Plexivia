# Plexivia Docker stack: MongoDB + Backend API + Admin Dashboard
#   cp deploy/.env.example deploy/.env   (fill in the secrets)
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  mongo:
    image: mongo:7.0
    container_name: plexivia_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27025}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - plexivia_internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: plexivia_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5095
      # MONGO_ROOT_PASSWORD must be URL-safe (letters, digits, - _ . ~)
      MONGODB_SECURE_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/plexivia_secure_db?authSource=admin
      MONGODB_OPERATIONS_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/plexivia_operations_db?authSource=admin
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-5095}:5095"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - plexivia_internal

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: plexivia_admin
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-8010}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - plexivia_internal

networks:
  plexivia_internal:
    driver: bridge

volumes:
  mongo_data:
